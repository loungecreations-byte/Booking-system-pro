name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - '*'

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: '8.1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-

      - name: Install dependencies
        env:
          SBDP_SKIP_NPM_POST_INSTALL: "1"
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build admin assets
        run: npm run build

      - name: Lint app stylesheet
        run: npm run lint:css

      - name: Run quality checks
        shell: pwsh
        run: ./scripts/run-quality-checks.ps1

      - name: Run PHPUnit
        run: php vendor/bin/phpunit --configuration tests/phpunit.xml.dist

      - name: Run Contract Tests
        run: php vendor/bin/phpunit --configuration tests/phpunit.xml.dist --filter AssistantResponseValidatorTest

      - name: Run Decision Smoke Tests
        run: php vendor/bin/phpunit --configuration tests/phpunit.xml.dist --filter DecisionEngineSmokeTest
